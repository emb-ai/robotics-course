<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>VacMan</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0d1117;
      font-family: "Courier New", Courier, "SF Mono", Consolas, monospace;
    }
    #game-container { position: relative; width: 100%; height: 100%; overflow: hidden; }
    kbd {
      display: inline-block; padding: 1px 5px; border: 1px solid #555;
      border-radius: 3px; background: #222; font: 11px/1.2 "Courier New", Courier, monospace;
    }
  </style>
</head>
<body>
  <div id="game-container"></div>
  <script>
    window.VACMAN_VISUALIZER = { containerId: "game-container" };
  </script>
  <script type="module">
    import { startVacmanViewer } from "./main.js";
    startVacmanViewer(window.VACMAN_VISUALIZER);
  </script>
</body>
</html>
