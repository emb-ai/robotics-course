<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Rocket TVC</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #0a0a2e; }
    canvas { display: block; width: 100%; height: 100%; }
  </style>
</head>
<body>
  <canvas id="rocket-canvas"></canvas>
  <script>
    window.ROCKET_VISUALIZER = { canvasId: "rocket-canvas", initialScenario: "landing" };
  </script>
  <script type="module">
    import { startRocketViewer } from "./main.js";
    startRocketViewer(window.ROCKET_VISUALIZER);
  </script>
</body>
</html>
